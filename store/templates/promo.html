<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .stage {
        width: 440px;
        height: 280px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
        padding: 0 36px;
      }
      .brand {
        font-size: 40px;
      }
      p {
        margin: 0;
        font-size: 19px;
        line-height: 1.35;
        opacity: 0.95;
      }
      .pill {
        align-self: flex-start;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgb(255 255 255 / 95%);
        color: #1f2328;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="brand">
        <img src="../assets/icon-128.png" width="72" height="72" alt="" />PR Clip
      </div>
      <p>Share pull requests in chat with one click.</p>
      <span class="pill mono"
        ><span class="add">+120</span> <span class="del">-30</span> Add dark mode</span
      >
    </div>
  </body>
</html>
