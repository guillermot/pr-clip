name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger CI; a PAT
          # (contents + pull-requests: write) lets required checks run on them.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Attach extension zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm zip
      - name: Upload zip to the GitHub release
        run: gh release upload "$TAG" .output/*-chrome.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  publish:
    name: Submit to Chrome Web Store
    needs: [release-please, package]
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
    steps:
      - name: Skip until Store credentials are configured
        if: env.CHROME_EXTENSION_ID == ''
        run: echo "::notice::CHROME_EXTENSION_ID is not set; skipping Chrome Web Store submission. See docs/PUBLISHING.md."
      - uses: actions/checkout@v7
        if: env.CHROME_EXTENSION_ID != ''
      - uses: pnpm/action-setup@v6
        if: env.CHROME_EXTENSION_ID != ''
      - uses: actions/setup-node@v7
        if: env.CHROME_EXTENSION_ID != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.CHROME_EXTENSION_ID != ''
        run: pnpm install --frozen-lockfile
      - if: env.CHROME_EXTENSION_ID != ''
        run: pnpm zip
      - name: Upload and submit for review
        if: env.CHROME_EXTENSION_ID != ''
        run: pnpm exec wxt submit --chrome-api-version v2 --chrome-zip .output/*-chrome.zip
        env:
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
