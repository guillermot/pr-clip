<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title data-i18n="optionsTitle">PR Clip options</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="/icon/48.png" alt="" width="40" height="40" />
        <div>
          <h1 data-i18n="extName">PR Clip</h1>
          <p class="muted" data-i18n="optionsSubtitle"></p>
        </div>
      </header>

      <form id="template-form">
        <section>
          <label for="template"><h2 data-i18n="templateHeading"></h2></label>
          <textarea id="template" rows="3" spellcheck="false" required></textarea>

          <p class="muted" data-i18n="placeholderHint"></p>
          <ul id="placeholders" class="placeholders"></ul>
        </section>

        <section>
          <h2 data-i18n="previewHeading"></h2>
          <output id="preview" for="template" class="preview"></output>
        </section>

        <div class="actions">
          <button type="submit" class="primary" data-i18n="save"></button>
          <button type="button" id="reset" data-i18n="resetToDefault"></button>
          <span id="status" role="status" class="muted"></span>
        </div>
      </form>

      <section>
        <h2 data-i18n="shortcutHeading"></h2>
        <p>
          <span data-i18n="shortcutCurrent"></span>
          <kbd id="shortcut" data-i18n="shortcutNotSet"></kbd>
          <a href="#" id="open-shortcuts" data-i18n="shortcutChange"></a>
        </p>
      </section>

      <section>
        <h2>
          <span data-i18n="tokenHeading"></span>
          <span class="muted" data-i18n="optional"></span>
        </h2>
        <p class="muted" data-i18n="tokenDescription"></p>
        <p>
          <a
            href="https://github.com/settings/personal-access-tokens/new"
            target="_blank"
            rel="noopener"
            data-i18n="tokenCreateLink"
          ></a>
        </p>
        <form id="token-form" class="actions">
          <input
            id="token"
            type="password"
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="tokenPlaceholder"
            data-i18n-aria-label="tokenLabel"
          />
          <button type="submit" class="primary" data-i18n="saveToken"></button>
          <button type="button" id="remove-token" data-i18n="removeToken"></button>
          <span id="token-status" role="status" class="muted"></span>
        </form>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
